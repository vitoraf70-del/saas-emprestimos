version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: "http://177.7.41.117:8080"
      AUTHENTICATION_TYPE: "apikey"
      AUTHENTICATION_API_KEY: "troque_esta_chave_por_uma_segura"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "sqlite"
      DATABASE_CONNECTION_URI: "file:/evolution/database.db"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - ./evolution_data:/evolution

  evolution-manager:
    image: atendai/evolution-manager:latest
    container_name: evolution_manager
    restart: unless-stopped
    depends_on:
      - evolution-api
    ports:
      - "8081:80"
    environment:
      VITE_EVOLUTION_API_URL: "http://evolution-api:8080"
